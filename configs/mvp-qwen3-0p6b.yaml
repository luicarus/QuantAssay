# Serving workload for both sides of a QuantAssay comparison.
# Request hashes are derived from the built-in prompts by the loader.
# Model, quantization, corpus and engine settings are configured through the CLI.

workload:
  workload_id: mvp-short-chat
  request_set_id: builtin-short-chat
  thinking_mode: disabled
  input_tokens_target: 128
  max_new_tokens: 64
  temperature: 0.0
  concurrency: 1
  request_rate: null
  warmup_requests: 3
  timed_requests: 20
  cache_policy: disabled
  timeout_seconds: 120.0
  retry_policy: none
